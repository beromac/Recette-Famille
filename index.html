<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nos recettes de famille</title>
<meta name="theme-color" content="#d9622b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fff8f1;--card:#fff;--ink:#2b2118;--mute:#7a6a5c;--acc:#d9622b;--acc2:#2f7d5b;--line:#eadccf;--sweet:#c2417c;--salt:#2f7d5b;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#1b1511;--card:#271e18;--ink:#f4e9de;--mute:#b3a091;--line:#3d3028;--acc:#f08a52;--acc2:#5cc596;--sweet:#f07db4;--salt:#5cc596}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top{display:flex;gap:8px;align-items:center;max-width:1100px;margin:auto}
.logo{font-weight:800;font-size:1.15rem;white-space:nowrap}
.top input[type=search]{flex:1;min-width:0;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.ib{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 12px;position:relative}
.ib .n{position:absolute;top:-6px;right:-4px;background:var(--acc);color:#fff;border-radius:99px;font-size:.7rem;padding:0 6px}
.filters{max-width:1100px;margin:8px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 10px}
main{max-width:1100px;margin:16px auto;padding:0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .12s}
.card:active{transform:scale(.98)}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,#ffe3cf,#ffd0b0);display:grid;place-items:center;font-size:3rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card .b{padding:10px 12px 12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--mute);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 10px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:600;color:#fff}
.badge.sucre{background:var(--sweet)}.badge.sale{background:var(--salt)}
.fav{position:absolute;top:8px;right:8px;background:#fffc;border:0;border-radius:99px;width:36px;height:36px;font-size:1.1rem}
.cw{position:relative}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px #0004;z-index:6}
dialog{border:0;border-radius:20px;padding:0;width:min(760px,96vw);max-height:94vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px #0007}
dialog::backdrop{background:#0008}
.dh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);z-index:2}
.dh h2{margin:0;font-size:1.1rem}
.db{padding:14px 18px 24px}
.hero{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#ffe3cf,#ffd0b0);display:grid;place-items:center;font-size:4rem;margin-bottom:12px}
.hero img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.85rem;color:var(--mute)}
.fact b{display:block;color:var(--ink);font-size:1.05rem}
.srv{display:flex;align-items:center;justify-content:center;gap:8px}
.srv button{width:28px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
h3.s{margin:20px 0 8px;border-bottom:2px solid var(--acc);display:inline-block}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:center}
.ing li.sec{font-weight:700;color:var(--acc);border:0;padding-top:14px}
.ing input{width:20px;height:20px;accent-color:var(--acc2)}
.ing li.done span{text-decoration:line-through;color:var(--mute)}
ol.steps{padding:0;margin:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;margin:12px 0}
ol.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:99px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700}
.tip{background:#fff3c9;color:#4a3a00;border-radius:12px;padding:10px 14px;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.d{color:#c0392b}
.tags span{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin:2px;font-size:.8rem;color:var(--mute)}
form label{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}
form input,form select,form textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.row.ing-r .f-qty{width:70px;flex:none}.row.ing-r .f-unit{width:120px;flex:none}
.row.sec input{font-weight:700;background:#ffe9d8}
.x{border:0;background:none;font-size:1.1rem;color:var(--mute)}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.seg input{display:none}.seg input:checked+span{font-weight:800}
.seg label:has(input:checked){border-color:var(--acc);background:var(--card)}
#cook{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
#cook[hidden]{display:none}
#cook .big{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:clamp(1.3rem,4.5vw,2.2rem);line-height:1.4;overflow:auto}
#cook .big small{color:var(--acc);font-weight:700;font-size:1rem;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:10px 18px;border-radius:99px;z-index:99;max-width:90vw;text-align:center}
.help{font-size:.82rem;color:var(--mute);margin:4px 0}
@media print{body>*:not(#view){display:none!important}#view{position:static;box-shadow:none;width:100%;max-height:none}.btns,.dh button,.fav,.srv button{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="logo">🍳 Nos recettes</span>
    <input id="q" type="search" placeholder="Chercher une recette, un ingrédient…">
    <button class="ib" id="bFav" title="Mes favoris">♥</button>
    <button class="ib" id="bShop" title="Liste de courses">🛒<span class="n" id="nShop" hidden>0</span></button>
    <button class="ib" id="bSet" title="Espace parent">⚙</button>
  </div>
  <div class="filters">
    <button class="chip on" data-cat="">Tout</button>
    <button class="chip" data-cat="sucre">🍰 Sucré</button>
    <button class="chip" data-cat="sale">🥘 Salé</button>
    <select id="fType"><option value="">Tous les types</option></select>
    <select id="fSort"><option value="new">Plus récentes</option><option value="az">A → Z</option><option value="time">Plus rapides</option></select>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Aucune recette trouvée 🍽️</div></main>
<button class="fab" id="bAdd" hidden>＋ Nouvelle recette</button>

<dialog id="view"></dialog>
<dialog id="edit"></dialog>
<dialog id="shop"></dialog>
<dialog id="set"></dialog>
<div id="cook" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const TYPES=['Entrée','Plat','Accompagnement','Soupe','Salade','Dessert','Gâteau','Goûter','Petit-déjeuner','Boisson','Sauce','Apéro','Pain & pâtes'];
const UNITS=['','g','kg','mg','ml','cl','dl','L','c. à café','c. à soupe','tasse','verre','pincée','noix','morceau','tranche','gousse','feuille','branche','sachet','boîte','pot'];
const DIFF=['','Facile','Moyen','Difficile'],COST=['','€','€€','€€€'];
const S={recipes:[],cat:'',type:'',q:'',sort:'new',favOnly:false,tmp:{}};
let fav=new Set(LS.get('fav',[]));
let shop=LS.get('shop',[]);
const gh=()=>LS.get('gh',{});
const isAdmin=()=>!!gh().token;

/* ---------- utilitaires ---------- */
function toast(m,ms=3500){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)}
function fmtQty(n){if(n==null||n==='')return'';n=Math.round(n*100)/100;const w=Math.floor(n),f=Math.round((n-w)*100)/100;const m={0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔',0.34:'⅓',0.66:'⅔'};if(m[f])return(w?w+' ':'')+m[f];if(f===0)return String(w);return String(n).replace('.',',')}
function parseQty(s){s=String(s||'').trim().replace(',','.');if(!s)return null;const m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];const f=s.match(/^(\d+)\/(\d+)$/);if(f)return f[1]/f[2];const n=parseFloat(s);return isNaN(n)?null:n}
function totalMin(r){return(+r.prepMin||0)+(+r.cookMin||0)}
function fmtMin(m){m=+m||0;if(!m)return'—';const h=Math.floor(m/60),mm=m%60;return h?`${h} h${mm?String(mm).padStart(2,'0'):''}`:`${mm} min`}
function photoSrc(r){if(S.tmp[r.id])return S.tmp[r.id];return r.photo?`${r.photo}?v=${encodeURIComponent(r.updatedAt||'')}`:''}
function phHtml(r){const s=photoSrc(r);return s?`<img src="${esc(s)}" alt="" loading="lazy">`:(r.category==='sucre'?'🍰':'🥘')}
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'recette';

/* ---------- chargement (mise à jour auto) ---------- */
async function load(){
  try{const r=await fetch('data/recipes.json',{cache:'no-cache'});if(!r.ok)throw 0;const d=await r.json();S.recipes=d.recipes||[];LS.set('cache',S.recipes)}
  catch{S.recipes=LS.get('cache',[])}
  render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#edit').open)load()});
setInterval(()=>{if(!document.hidden&&!$('#edit').open)load()},5*60*1000);

/* ---------- liste ---------- */
function render(){
  const tp=[...new Set(S.recipes.map(r=>r.type).filter(Boolean))].sort();
  const sel=$('#fType');const cur=S.type;
  sel.innerHTML='<option value="">Tous les types</option>'+tp.map(t=>`<option ${t===cur?'selected':''}>${esc(t)}</option>`).join('');
  const q=S.q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let l=S.recipes.filter(r=>{
    if(S.cat&&r.category!==S.cat)return false;
    if(S.type&&r.type!==S.type)return false;
    if(S.favOnly&&!fav.has(r.id))return false;
    if(q){const hay=[r.title,r.description,r.type,(r.tags||[]).join(' '),(r.ingredients||[]).map(i=>i.name||i.section).join(' ')].join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(!hay.includes(q))return false}
    return true});
  if(S.sort==='az')l.sort((a,b)=>a.title.localeCompare(b.title,'fr'));
  else if(S.sort==='time')l.sort((a,b)=>totalMin(a)-totalMin(b));
  else l.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  $('#grid').innerHTML=l.map(r=>`<div class="cw"><button class="card" data-id="${esc(r.id)}"><div class="ph">${phHtml(r)}</div><div class="b"><h3>${esc(r.title)}</h3><div class="meta"><span class="badge ${esc(r.category)}">${r.category==='sucre'?'Sucré':'Salé'}</span>${r.type?`<span>${esc(r.type)}</span>`:''}<span>⏱ ${fmtMin(totalMin(r))}</span>${r.difficulty?`<span>${DIFF[r.difficulty]}</span>`:''}</div></div></button><button class="fav" data-fav="${esc(r.id)}">${fav.has(r.id)?'♥':'♡'}</button></div>`).join('');
  $('#empty').hidden=l.length>0;
  $('#bAdd').hidden=!isAdmin();
  $('#bFav').style.background=S.favOnly?'var(--acc)':'';$('#bFav').style.color=S.favOnly?'#fff':'';
  updShopBadge();
}
$('#q').oninput=e=>{S.q=e.target.value;render()};
$('#fType').onchange=e=>{S.type=e.target.value;render()};
$('#fSort').onchange=e=>{S.sort=e.target.value;render()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');S.cat=c.dataset.cat;render()});
$('#bFav').onclick=()=>{S.favOnly=!S.favOnly;render()};
$('#grid').onclick=e=>{const f=e.target.closest('[data-fav]');if(f){toggleFav(f.dataset.fav);return}const c=e.target.closest('.card');if(c)openView(c.dataset.id)};
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);LS.set('fav',[...fav]);render();const b=$('#view [data-favbtn]');if(b&&$('#view').open)b.textContent=fav.has(id)?'♥ Favori':'♡ Favori'}

/* ---------- fiche recette ---------- */
let cur=null,curServ=4,have=new Set();
function openView(id){cur=S.recipes.find(r=>r.id===id);if(!cur)return;curServ=+cur.servings||4;have=new Set();drawView();$('#view').showModal()}
function drawView(){
  const r=cur,f=curServ/(+r.servings||curServ);
  const ings=(r.ingredients||[]).map((i,k)=>i.section!==undefined?`<li class="sec">${esc(i.section)}</li>`:`<li class="${have.has(k)?'done':''}"><input type="checkbox" id="i${k}" ${have.has(k)?'checked':''}><label for="i${k}"><span><b>${fmtQty(i.qty!=null?i.qty*f:null)} ${esc(i.unit||'')}</b> ${esc(i.name)}${i.note?` <i style="color:var(--mute)">(${esc(i.note)})</i>`:''}</span></label></li>`).join('');
  $('#view').innerHTML=`<div class="dh"><h2>${esc(r.title)}</h2><button class="x" data-close>✕</button></div><div class="db">
  <div class="hero">${phHtml(r)}</div>
  <span class="badge ${esc(r.category)}">${r.category==='sucre'?'Sucré':'Salé'}</span> ${r.type?`<span class="meta" style="display:inline">${esc(r.type)}</span>`:''}
  ${r.description?`<p>${esc(r.description)}</p>`:''}
  <div class="facts">
   <div class="fact"><div class="srv"><button data-srv="-1">−</button><b>${curServ}</b><button data-srv="1">＋</button></div>${esc(r.servingsLabel||'personnes')}</div>
   <div class="fact"><b>${fmtMin(r.prepMin)}</b>Préparation</div>
   <div class="fact"><b>${fmtMin(r.cookMin)}</b>Cuisson</div>
   ${r.restMin?`<div class="fact"><b>${fmtMin(r.restMin)}</b>Repos</div>`:''}
   <div class="fact"><b>${fmtMin(totalMin(r)+(+r.restMin||0))}</b>Total</div>
   ${r.difficulty?`<div class="fact"><b>${DIFF[r.difficulty]}</b>Difficulté</div>`:''}
   ${r.cost?`<div class="fact"><b>${COST[r.cost]}</b>Budget</div>`:''}
   ${r.oven?`<div class="fact"><b>${esc(r.oven)}</b>Four</div>`:''}
  </div>
  <div class="btns"><button class="btn p" data-cookmode>👩‍🍳 Mode cuisine</button><button class="btn" data-favbtn>${fav.has(r.id)?'♥ Favori':'♡ Favori'}</button><button class="btn" data-addshop>🛒 Ajouter aux courses</button><button class="btn" onclick="print()">🖨 Imprimer</button>${isAdmin()?`<button class="btn" data-edit>✏️ Modifier</button><button class="btn d" data-del>🗑 Supprimer</button>`:''}</div>
  <h3 class="s">Ingrédients</h3><ul class="ing">${ings}</ul>
  ${(r.equipment||[]).length?`<h3 class="s">Ustensiles</h3><p>${r.equipment.map(esc).join(' • ')}</p>`:''}
  <h3 class="s">Préparation</h3><ol class="steps">${(r.steps||[]).map(s=>`<li><div>${esc(s).replace(/\n/g,'<br>')}</div></li>`).join('')}</ol>
  ${r.tips?`<div class="tip">💡 <b>Astuce :</b> ${esc(r.tips).replace(/\n/g,'<br>')}</div>`:''}
  ${r.storage?`<p><b>Conservation :</b> ${esc(r.storage)}</p>`:''}
  ${r.nutrition?`<p class="meta">Valeurs nutritionnelles : ${esc(r.nutrition)}</p>`:''}
  ${(r.tags||[]).length?`<div class="tags">${r.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}
  <p class="help">${r.author?`Recette de ${esc(r.author)}`:''}${r.source?` · Source : ${esc(r.source)}`:''}</p></div>`;
}
$('#view').onclick=e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t===$('#view'))return $('#view').close();
  const s=t.closest('[data-srv]');if(s){curServ=Math.max(1,curServ+ +s.dataset.srv);drawView();return}
  if(t.closest('[data-favbtn]'))return toggleFav(cur.id);
  if(t.closest('[data-addshop]'))return addShop();
  if(t.closest('[data-cookmode]'))return cookMode();
  if(t.closest('[data-edit]')){$('#view').close();return openEdit(cur)}
  if(t.closest('[data-del]'))return delRecipe();
  const cb=t.closest('.ing input');if(cb){cb.closest('li').classList.toggle('done',cb.checked);const k=+cb.id.slice(1);cb.checked?have.add(k):have.delete(k)}
};

/* ---------- mode cuisine ---------- */
let wl=null;
async function cookMode(){
  const steps=cur.steps||[];let k=0;
  try{wl=await navigator.wakeLock?.request('screen')}catch{}
  const el=$('#cook');el.hidden=false;
  const draw=()=>{el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(cur.title)}</b><button class="btn" id="cx">Quitter ✕</button></div><div class="bar"><i style="width:${(k+1)/steps.length*100}%"></i></div><div class="big"><small>Étape ${k+1} / ${steps.length}</small>${esc(steps[k]).replace(/\n/g,'<br>')}</div><div class="two"><button class="btn" id="cp" ${k?'':'disabled'}>← Précédent</button><button class="btn p" id="cn">${k<steps.length-1?'Suivant →':'Terminé 🎉'}</button></div>`;
    $('#cx').onclick=close;$('#cp').onclick=()=>{k--;draw()};$('#cn').onclick=()=>{k<steps.length-1?(k++,draw()):close()}};
  const close=()=>{el.hidden=true;wl?.release?.();wl=null};
  draw();
}

/* ---------- courses ---------- */
function updShopBadge(){const n=shop.filter(i=>!i.done).length;const b=$('#nShop');b.hidden=!n;b.textContent=n}
function addShop(){
  const f=curServ/(+cur.servings||curServ);
  let skipped=0,added=0;
  (cur.ingredients||[]).forEach((i,k)=>{
    if(!i.name)return;
    if(have.has(k)){skipped++;return}
    added++;
    const q=i.qty!=null?i.qty*f:null;const key=(i.name+'|'+(i.unit||'')).toLowerCase();
    const ex=shop.find(x=>x.key===key&&!x.done);
    if(ex&&ex.qty!=null&&q!=null)ex.qty+=q;else if(!ex)shop.push({key,name:i.name,unit:i.unit||'',qty:q,done:false});
  });
  LS.set('shop',shop);updShopBadge();
  toast(!added?'Tout est déjà chez toi, rien à acheter 👍':skipped?`${added} ingrédient(s) ajouté(s) aux courses 🛒 (${skipped} déjà à la maison)`:'Ingrédients ajoutés à la liste de courses 🛒');
}
function drawShop(){
  $('#shop').innerHTML=`<div class="dh"><h2>🛒 Liste de courses</h2><button class="x" data-close>✕</button></div><div class="db">${shop.length?`<ul class="ing">${shop.map((i,k)=>`<li class="${i.done?'done':''}"><input type="checkbox" data-k="${k}" ${i.done?'checked':''} id="s${k}"><label for="s${k}" style="flex:1"><span><b>${fmtQty(i.qty)} ${esc(i.unit)}</b> ${esc(i.name)}</span></label><button class="x" data-rm="${k}">✕</button></li>`).join('')}</ul><div class="btns"><button class="btn" data-clr="done">Retirer les cochés</button><button class="btn d" data-clr="all">Tout vider</button></div>`:'<p class="empty">Ta liste est vide.</p>'}</div>`;
}
$('#bShop').onclick=()=>{drawShop();$('#shop').showModal()};
$('#shop').onclick=e=>{
  const t=e.target;if(t.closest('[data-close]')||t===$('#shop'))return $('#shop').close();
  const c=t.closest('input[data-k]');if(c){shop[+c.dataset.k].done=c.checked;}
  const r=t.closest('[data-rm]');if(r)shop.splice(+r.dataset.rm,1);
  const cl=t.closest('[data-clr]');if(cl)shop=cl.dataset.clr==='all'?[]:shop.filter(i=>!i.done);
  if(c||r||cl){LS.set('shop',shop);drawShop();updShopBadge()}
};

/* ---------- GitHub (mode parent) ---------- */
async function api(path,opt={}){const g=gh();const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/${path}`,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+g.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});if(!r.ok){let m='';try{m=(await r.json()).message}catch{}throw new Error(`GitHub ${r.status} — ${m}`)}return r.json()}
async function getFile(p){try{return await api(`contents/${p}?ref=${gh().branch||'main'}`)}catch(e){if(/ 404 /.test(e.message))return null;throw e}}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const putFile=(p,content,msg,sha)=>api(`contents/${p}`,{method:'PUT',body:JSON.stringify({message:msg,content,branch:gh().branch||'main',sha})});
async function mutate(fn,msg){
  const f=await getFile('data/recipes.json');
  const d=f?JSON.parse(unb64(f.content)):{recipes:[]};
  d.recipes=fn(d.recipes||[]);d.updatedAt=new Date().toISOString();
  await putFile('data/recipes.json',b64(JSON.stringify(d,null,2)),msg,f?.sha);
  return d.recipes;
}
function resize(file,max=1000){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ---------- éditeur ---------- */
const ingRow=(i={})=>i.section!==undefined?`<div class="row sec" data-t="s"><input class="f-sec" placeholder="Titre de section (ex : Pour la pâte)" value="${esc(i.section)}"><button type="button" class="x" data-rm>✕</button></div>`:`<div class="row ing-r" data-t="i"><input class="f-qty" inputmode="decimal" placeholder="Qté" value="${i.qty!=null?fmtQty(i.qty).replace('.',','):''}"><select class="f-unit">${UNITS.map(u=>`<option ${u===(i.unit||'')?'selected':''}>${u}</option>`).join('')}</select><input class="f-name" placeholder="Ingrédient" value="${esc(i.name)}"><button type="button" class="x" data-rm>✕</button></div>`;
const stepRow=(s='')=>`<div class="row"><textarea class="f-step" rows="2" placeholder="Décris l'étape…">${esc(s)}</textarea><button type="button" class="x" data-rm>✕</button></div>`;
function openEdit(r){
  const n=!r;r=r||{category:'sale',servings:4,difficulty:1,ingredients:[{}, {}, {}],steps:['']};
  $('#edit').innerHTML=`<div class="dh"><h2>${n?'Nouvelle recette':'Modifier la recette'}</h2><button class="x" data-close>✕</button></div><form class="db" id="ef">
  <label>Nom de la recette *</label><input name="title" required value="${esc(r.title)}">
  <label>Sucré ou salé ?</label><div class="seg"><label><input type="radio" name="category" value="sucre" ${r.category==='sucre'?'checked':''}><span>🍰 Sucré</span></label><label><input type="radio" name="category" value="sale" ${r.category!=='sucre'?'checked':''}><span>🥘 Salé</span></label></div>
  <div class="two"><div><label>Type</label><select name="type"><option value="">—</option>${TYPES.map(t=>`<option ${t===r.type?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Pour combien ?</label><div class="two"><input name="servings" type="number" min="1" value="${r.servings||4}"><input name="servingsLabel" placeholder="personnes" value="${esc(r.servingsLabel||'')}"></div></div></div>
  <label>Description (en une ou deux phrases)</label><textarea name="description" rows="2">${esc(r.description)}</textarea>
  <label>Photo</label><input type="file" name="photo" accept="image/*">${r.photo?'<p class="help">Une photo existe déjà ; en choisir une nouvelle la remplace.</p>':''}
  <div class="three"><div><label>Préparation (min)</label><input name="prepMin" type="number" min="0" value="${r.prepMin??''}"></div><div><label>Cuisson (min)</label><input name="cookMin" type="number" min="0" value="${r.cookMin??''}"></div><div><label>Repos (min)</label><input name="restMin" type="number" min="0" value="${r.restMin??''}"></div></div>
  <div class="three"><div><label>Difficulté</label><select name="difficulty">${[1,2,3].map(d=>`<option value="${d}" ${+r.difficulty===d?'selected':''}>${DIFF[d]}</option>`).join('')}</select></div><div><label>Budget</label><select name="cost"><option value="">—</option>${[1,2,3].map(d=>`<option value="${d}" ${+r.cost===d?'selected':''}>${COST[d]}</option>`).join('')}</select></div><div><label>Four</label><input name="oven" placeholder="ex : 180 °C" value="${esc(r.oven)}"></div></div>
  <label>Ingrédients *</label><div id="ings">${(r.ingredients||[]).map(ingRow).join('')}</div>
  <div class="btns"><button type="button" class="btn" id="addI">＋ Ingrédient</button><button type="button" class="btn" id="addSec">＋ Titre de section</button></div>
  <label>Ustensiles (séparés par des virgules)</label><input name="equipment" value="${esc((r.equipment||[]).join(', '))}" placeholder="saladier, fouet, moule à tarte">
  <label>Étapes *</label><div id="steps">${(r.steps||['']).map(stepRow).join('')}</div><button type="button" class="btn" id="addS">＋ Étape</button>
  <label>Astuce du chef</label><textarea name="tips" rows="2">${esc(r.tips)}</textarea>
  <label>Conservation</label><input name="storage" value="${esc(r.storage)}" placeholder="ex : 3 jours au frigo">
  <label>Valeurs nutritionnelles (facultatif)</label><input name="nutrition" value="${esc(r.nutrition)}" placeholder="ex : 320 kcal / portion">
  <div class="two"><div><label>Mots-clés (virgules)</label><input name="tags" value="${esc((r.tags||[]).join(', '))}" placeholder="rapide, enfants, végétarien"></div><div><label>Auteur / source</label><input name="author" value="${esc(r.author)}" placeholder="Mamie Jeanne"></div></div>
  <div class="btns"><button class="btn p" type="submit" id="save">💾 Enregistrer</button><button type="button" class="btn" data-close>Annuler</button></div>
  <p class="help">À l'enregistrement, la recette est publiée sur GitHub et apparaît chez les enfants en 1 à 2 minutes.</p></form>`;
  $('#edit').showModal();
  const ef=$('#ef');
  ef.onclick=e=>{
    const t=e.target;
    if(t.closest('[data-rm]'))t.closest('.row').remove();
    if(t.id==='addI')$('#ings').insertAdjacentHTML('beforeend',ingRow());
    if(t.id==='addSec')$('#ings').insertAdjacentHTML('beforeend',ingRow({section:''}));
    if(t.id==='addS')$('#steps').insertAdjacentHTML('beforeend',stepRow());
    if(t.closest('[data-close]'))$('#edit').close();
  };
  ef.onsubmit=async e=>{e.preventDefault();await saveRecipe(ef,n?null:r)};
}
async function saveRecipe(ef,old){
  const fd=new FormData(ef);const btn=$('#save');
  const ingredients=[...ef.querySelectorAll('#ings .row')].map(r=>r.dataset.t==='s'?{section:r.querySelector('.f-sec').value.trim()}:{qty:parseQty(r.querySelector('.f-qty').value),unit:r.querySelector('.f-unit').value,name:r.querySelector('.f-name').value.trim()}).filter(i=>i.section!==undefined?i.section:i.name);
  const steps=[...ef.querySelectorAll('.f-step')].map(x=>x.value.trim()).filter(Boolean);
  if(!ingredients.some(i=>i.name))return toast('Ajoute au moins un ingrédient');
  if(!steps.length)return toast('Ajoute au moins une étape');
  const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
  const now=new Date().toISOString();
  const rec={...(old||{}),id:old?.id||slug(fd.get('title'))+'-'+Date.now().toString(36),title:fd.get('title').trim(),category:fd.get('category'),type:fd.get('type'),description:fd.get('description').trim(),servings:+fd.get('servings')||4,servingsLabel:fd.get('servingsLabel').trim(),prepMin:+fd.get('prepMin')||0,cookMin:+fd.get('cookMin')||0,restMin:+fd.get('restMin')||0,difficulty:+fd.get('difficulty')||1,cost:+fd.get('cost')||0,oven:fd.get('oven').trim(),ingredients,equipment:list(fd.get('equipment')),steps,tips:fd.get('tips').trim(),storage:fd.get('storage').trim(),nutrition:fd.get('nutrition').trim(),tags:list(fd.get('tags')),author:fd.get('author').trim(),createdAt:old?.createdAt||now,updatedAt:now};
  btn.disabled=true;btn.textContent='Publication…';
  try{
    const file=fd.get('photo');
    if(file&&file.size){
      const url=await resize(file);const path=`images/${rec.id}.jpg`;const ex=await getFile(path);
      await putFile(path,url.split(',')[1],`Photo : ${rec.title}`,ex?.sha);
      rec.photo=path;S.tmp[rec.id]=url;
    }else if(!rec.photo&&old){
      const p=`images/${rec.id}.jpg`;if(await getFile(p))rec.photo=p;
    }
    S.recipes=await mutate(l=>{const k=l.findIndex(x=>x.id===rec.id);if(!rec.photo&&k>=0&&l[k].photo)rec.photo=l[k].photo;k>=0?l[k]=rec:l.push(rec);return l},`${old?'Modifie':'Ajoute'} : ${rec.title}`);
    LS.set('cache',S.recipes);
    $('#edit').close();render();toast('✅ Enregistré ! Visible chez les enfants dans 1 à 2 minutes.',5000);
  }catch(err){toast('Erreur : '+err.message,7000);btn.disabled=false;btn.textContent='💾 Enregistrer'}
}
async function delRecipe(){
  if(!confirm(`Supprimer « ${cur.title} » pour tout le monde ?`))return;
  try{S.recipes=await mutate(l=>l.filter(x=>x.id!==cur.id),`Supprime : ${cur.title}`);LS.set('cache',S.recipes);$('#view').close();render();toast('Recette supprimée')}
  catch(e){toast('Erreur : '+e.message,7000)}
}
$('#bAdd').onclick=()=>openEdit(null);
$('#edit').addEventListener('cancel',e=>{if(!confirm('Fermer sans enregistrer ?'))e.preventDefault()});

/* ---------- réglages parent ---------- */
function guess(){const h=location.hostname,p=location.pathname.split('/')[1];return h.endsWith('github.io')?{owner:h.split('.')[0],repo:p||h}:{}}
function drawSet(){
  const g={branch:'main',...guess(),...gh()};
  $('#set').innerHTML=`<div class="dh"><h2>⚙ Espace parent</h2><button class="x" data-close>✕</button></div><form class="db" id="sf">
  <p>${isAdmin()?'✅ Mode parent actif : tu peux ajouter, modifier et supprimer des recettes.':'Réservé aux parents. Les enfants n\'ont rien à configurer : l\'app se met à jour toute seule.'}</p>
  <div class="two"><div><label>Compte GitHub</label><input name="owner" value="${esc(g.owner)}" required></div><div><label>Nom du dépôt</label><input name="repo" value="${esc(g.repo)}" required></div></div>
  <label>Branche</label><input name="branch" value="${esc(g.branch)}">
  <label>Jeton d'accès GitHub (token)</label><input name="token" type="password" value="${esc(g.token)}" placeholder="github_pat_…" autocomplete="off">
  <p class="help">Jeton « fine-grained » limité à ce dépôt, permission <b>Contents : Read and write</b>. Il reste uniquement sur cet appareil. Ne le donne pas aux enfants (voir le README).</p>
  <div class="btns"><button class="btn p">Enregistrer & tester</button>${isAdmin()?'<button type="button" class="btn d" id="logout">Quitter le mode parent</button>':''}<button type="button" class="btn" id="refresh">↻ Actualiser les recettes</button></div></form>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);LS.set('gh',{owner:fd.get('owner').trim(),repo:fd.get('repo').trim(),branch:fd.get('branch').trim()||'main',token:fd.get('token').trim()});
    try{await api('');toast('✅ Connexion réussie, mode parent activé');drawSet();render()}catch(err){toast('❌ '+err.message,7000)}};
  const lo=$('#logout');if(lo)lo.onclick=()=>{LS.set('gh',{});drawSet();render()};
  $('#refresh').onclick=async()=>{await load();toast('Recettes actualisées')};
}
$('#bSet').onclick=()=>{drawSet();$('#set').showModal()};
$('#set').onclick=e=>{if(e.target.closest('[data-close]')||e.target===$('#set'))$('#set').close()};

/* ---------- démarrage ---------- */
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
